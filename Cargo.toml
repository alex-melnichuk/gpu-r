[package]
name = "gpu-r"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = "0.37.0"
egui_plot = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.191"
libloading = "0.9.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
wgpu = "30.0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
